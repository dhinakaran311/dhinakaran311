name: 🔄 Update Showcase Projects

on:
  schedule:
    - cron: "0 */6 * * *" # runs every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Top Repositories Showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dhinakaran311
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          
          # ✅ Valid plugin settings
          plugin_repositories: yes
          plugin_repositories_affiliations: owner
          plugin_repositories_order: stars
          plugin_repositories_pinned: yes
          plugin_repositories_featured: yes
          plugin_repositories_forks: yes
          plugin_repositories_starred: no
          
          # Output file
          filename: showcase.svg

      - name: Commit and Push Showcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add showcase.svg
          git commit -m "🔄 Update Showcase (Top Repos)" || echo "No changes to commit"
          git push

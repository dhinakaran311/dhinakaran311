name: 🔄 Update Showcase Projects

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch:      # Manual trigger option

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Generate Top Repositories Showcase
      - name: Generate Top Repositories Showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dhinakaran311
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          
          # Plugin settings
          plugin_repositories: yes
          plugin_repositories_affiliations: owner
          plugin_repositories_order: stars
          plugin_repositories_pinned: yes
          plugin_repositories_featured: yes
          plugin_repositories_forks: yes
          plugin_repositories_starred: no
          
          # Output file in repo root
          filename: showcase.svg

      # 3️⃣ Commit & push the generated file
      - name: Commit and Push Showcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure the file exists before committing
          if [ -f "showcase.svg" ]; then
            git add showcase.svg
            git diff --staged --quiet || git commit -m "🔄 Update Showcase (Top Repos)"
            git push
          else
            echo "❌ showcase.svg not found, skipping commit."
          fi

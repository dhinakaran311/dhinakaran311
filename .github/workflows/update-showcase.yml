name: 🔄 Update Showcase Projects

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Top Repositories Showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Dhinakaran311
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_repositories: yes
          plugin_repositories_affiliations: owner
          plugin_repositories_limit: 6
          plugin_repositories_order: stars
          plugin_repositories_features: stars, forks
          config_theme: react
          filename: showcase.svg

      - name: Commit and Push Showcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add showcase.svg
          git commit -m "🔄 Update Showcase (Top Repos)" || echo "No changes to commit"
          git push
